    <style>
      html { scroll-behavior: smooth; }
      body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
      ::selection { background: #f27d26; color: #000; }
      #root { min-height: 100dvh; }
      .boot-hide { opacity: 0; }
      .boot-fade { animation: bootFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      @keyframes bootFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
      .boot-screen {
        position: fixed; inset: 0; z-index: 9999;
        background: #0A0A0B;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 24px;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      .boot-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .boot-logo {
        width: 88px; height: 88px;
        animation: bootPulse 1.6s ease-in-out infinite;
      }
      @keyframes bootPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(212, 160, 23, 0)); }
        50% { transform: scale(1.04); filter: drop-shadow(0 0 24px rgba(212, 160, 23, 0.35)); }
      }
      .boot-text {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 10px; font-weight: 900; letter-spacing: 0.5em;
        text-transform: uppercase; color: #D4A017;
        opacity: 0.7; animation: bootText 1.6s ease-in-out infinite;
      }
      @keyframes bootText { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; } }
      .boot-progress {
        width: 120px; height: 2px; background: rgba(255,255,255,0.06);
        border-radius: 999px; overflow: hidden;
      }
      .boot-progress-bar {
        height: 100%; width: 0%; background: linear-gradient(90deg, #F5C842, #f27d26);
        animation: bootProgress 1.4s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      @keyframes bootProgress { to { width: 100%; } }
      @media (prefers-reduced-motion: reduce) {
        .boot-logo, .boot-text, .boot-progress-bar { animation: none; }
        .boot-progress-bar { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="boot-screen" class="boot-screen" aria-hidden="true">
      <svg class="boot-logo" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F5C842"/><stop offset="50%" stop-color="#D4A017"/><stop offset="100%" stop-color="#A67C00"/></linearGradient></defs>

        <path d="M230 300 C220 305, 218 320, 225 328 L240 340 C248 345, 264 345, 272 340 L287 328 C294 320, 292 305, 282 300 C275 295, 262 290, 256 295 C250 290, 237 295, 230 300 Z" fill="url(#bg)"/>
        <path d="M220 345 C210 355, 208 370, 220 380 L256 395 L292 380 C304 370, 302 355, 292 345 M256 350 L256 395 M160 290 L200 298 M158 310 L200 314 M162 328 L200 326 M352 290 L312 298 M354 310 L312 314 M350 328 L312 326 M220 400 L256 450 L292 400" stroke="url(#bg)" stroke-width="8" stroke-linecap="round" fill="none"/>
      </svg>
      <div class="boot-progress"><div class="boot-progress-bar"></div></div>
      <div class="boot-text">Establishing Authority</div>
    </div>
    <div id="root" class="boot-hide"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function() {
        const root = document.getElementById('root');
        const boot = document.getElementById('boot-screen');
        if (root) root.classList.remove('boot-hide');
        setTimeout(function() {
          if (boot) boot.classList.add('hidden');
          if (root) root.classList.add('boot-fade');
          setTimeout(function() { if (boot) boot.remove(); }, 700);
        }, 1500);
      });
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        window.addEventListener('scroll', function() {
          const vh = window.innerHeight * 0.01;
          document.documentElement.style.setProperty('--vh', vh + 'px');
        }, { passive: true });
        document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
      }
    </script>
  </body>
